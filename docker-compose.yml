services:
  mysql_db:
    image: mysql:8.0
    container_name: kora_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 45s
    networks:
      - kora_net

  redis_evo:
    image: redis:7-alpine
    container_name: kora_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kora_net

  postgres_evo:
    image: postgres:15-alpine
    container_name: kora_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password
      POSTGRES_DB: evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_db || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kora_net

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: kora_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=Kora_Token_Secreto_2026
      # Database Configuration (PostgreSQL - banco nativo oficial da Evolution v2)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password@postgres_evo:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      # Redis Cache Configuration
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis_evo:6379/1
      - CACHE_REDIS_PREFIX_KEY=evo
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      # Security & Webhook configuration
      - WEBHOOK_GLOBAL_ENABLED=false
      - DEL_INSTANCE=true
      - CONFIG_SESSION_PHONE_CLIENT=Ubuntu
      - QRCODE_LIMIT=30
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      postgres_evo:
        condition: service_healthy
      redis_evo:
        condition: service_healthy
    networks:
      - kora_net

  kora_api:
    build:
      context: ./Kora.Api
      dockerfile: Dockerfile
    container_name: kora_api
    restart: always
    ports:
      - "5001:5001"
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Port=3306;Database=kora_db;User=root;Password=rootpassword;
      - EvolutionApi__BaseUrl=http://evolution-api:8080
      - EvolutionApi__ApiKey=Kora_Token_Secreto_2026
      - EvolutionApi__InstanceName=KoraAtendimento
      - EvolutionApi__WebhookUrl=http://kora_api:5001/api/whatsapp/webhook
      - Jwt__SecretKey=Kora_Omnichannel_SaaS_Secret_Key_Secure_2026_Minimum_32_Chars!
      - Jwt__Issuer=KoraSaaS
      - Jwt__Audience=KoraSaaS
      - ASPNETCORE_URLS=http://+:5001
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      mysql_db:
        condition: service_healthy
      evolution-api:
        condition: service_started
    networks:
      - kora_net

  kora_ui:
    build:
      context: ./kora-ui
      dockerfile: Dockerfile
    container_name: kora_ui
    restart: always
    ports:
      - "4202:80"
    depends_on:
      - kora_api
    networks:
      - kora_net

networks:
  kora_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  postgres_data:
  evolution_instances:
  evolution_store:
