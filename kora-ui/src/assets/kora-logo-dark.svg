<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <linearGradient id="darkLogoKoraGrad" x1="4" y1="6" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="darkLogoKoraPulse" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="darkLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="46" height="46" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <!-- Stem of K -->
    <path d="M12 12C12 10.8954 12.8954 10 14 10H15C16.1046 10 17 10.8954 17 12V34C17 35.1046 16.1046 36 15 36H14C12.8954 36 12 35.1046 12 34V12Z" fill="url(#darkLogoKoraGrad)"/>
    <!-- Branches of K / Converging Core -->
    <path d="M17 23.5L27.2 12.5C27.98 11.65 29.33 11.7 30.05 12.6C30.73 13.45 30.65 14.68 29.87 15.53L21.8 24.3L30.2 33.2C30.96 34.01 30.93 35.27 30.14 36.04C29.35 36.82 28.08 36.79 27.31 35.98L17 25V23.5Z" fill="url(#darkLogoKoraGrad)"/>
    <!-- Heart Core -->
    <circle cx="22" cy="23" r="4.2" fill="url(#darkLogoKoraPulse)" filter="url(#darkLogoGlow)"/>
    <circle cx="22" cy="23" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- Typography: KORA -->
  <text x="62" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" letter-spacing="0.04em" fill="#FFFFFF">
    KORA
  </text>

  <!-- Badge: AI -->
  <rect x="150" y="16" width="38" height="23" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
  <text x="169" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#A5B4FC" text-anchor="middle">
    AI
  </text>
</svg>