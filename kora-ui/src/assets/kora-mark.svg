  <path d="M14 13C14 11.8954 14.8954 11 16 11H17C18.1046 11 19 11.8954 19 13V35C19 36.1046 18.1046 37 17 37H16C14.8954 37 14 36.1046 14 35V13Z" fill="url(#koraGrad1)"/>

  <!-- Upper Branch / Converging Heart Node -->
  <path d="M19 24.5L29.2 13.5C29.98 12.65 31.33 12.7 32.05 13.6C32.73 14.45 32.65 15.68 31.87 16.53L23.8 25.3L32.2 34.2C32.96 35.01 32.93 36.27 32.14 37.04C31.35 37.82 30.08 37.79 29.31 36.98L19 26V24.5Z" fill="url(#koraGrad1)"/>

  <!-- The "Kora" Heart Core (Glowing Central Nucleus) -->
